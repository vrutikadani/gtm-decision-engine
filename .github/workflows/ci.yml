name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Evaluation (fails on any new critical identity result)
        run: python evals/run_eval.py
      - name: Core engine has no third-party imports (needed for the in-browser demo)
        run: |
          if grep -rnE "^(from|import) (fastapi|pydantic|uvicorn|starlette|requests|httpx)" gde --include=*.py --exclude=api.py --exclude=server.py; then
            echo "third-party import in core engine"; exit 1
          fi
